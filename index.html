<style>
:root{
  --bg:#f5f2ec;--card:#ffffff;--ink:#2b2a28;--muted:#7d776e;--line:#e7e1d7;
  --accent:#5b7a6a;--accent-soft:#e2ebe5;--ok:#3f7d58;--ok-soft:#e1f0e6;
  --bad:#b4473f;--bad-soft:#f6e1de;--warn:#b26a2c;--warn-soft:#f8ead9;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
header{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.2px}
header small{color:var(--muted)}
main{padding:12px 16px 24px;max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0}
label input,label select,label textarea{margin-top:4px}
h3{margin:4px 0 2px;font-size:20px}
h4{margin:0 0 8px;font-size:16px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center;display:block;margin:8px auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--line);width:100%;text-align:left}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;margin-top:10px;text-align:center;text-decoration:none}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;margin-top:0}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.ghost.bad{background:var(--bad-soft);color:var(--bad)}
.link{color:var(--accent);font-weight:600;padding:6px 0}
.link.bad{color:var(--bad)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.rowbtns .btn{flex:1}
.ic{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:22px;line-height:1}
.weeknav,.mesnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.wk{text-align:center;display:flex;flex-direction:column}.wk span{font-size:13px;color:var(--muted)}
.mesnav b{font-size:17px}
.chips{display:flex;gap:6px;margin:6px 0 12px}
.chip{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center}
.chip small{font-size:11px;color:var(--muted)}.chip b{font-size:17px}
.chip.today{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}.chip.on small{color:#e8f0eb}
.dayttl{font-weight:700;margin:2px 0 10px;font-size:17px}
.slothd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hora{font-size:20px;font-weight:700}
.cupo{font-size:13px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:20px}
.cupo.over{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;width:100%;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-align:left;gap:8px}
.row .nm{font-weight:500}
.chip.off b{text-decoration:line-through;opacity:.5}
.susp{background:#ece8e1;border-radius:12px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px}
.susp span{font-size:13px;color:var(--muted)}
.cardoff{opacity:.55}
.sl{display:flex;align-items:center;gap:10px}
.link.small{font-size:13px;color:var(--muted);font-weight:500}
.nro.ult{background:var(--warn);color:#fff}
.nro{display:inline-block;min-width:26px;text-align:center;margin-right:8px;padding:2px 6px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:14px}
.add{width:100%;margin-top:6px;padding:10px;border:1.5px dashed var(--line);border-radius:10px;color:var(--accent);font-weight:600}
.tag{font-style:normal;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--bg);color:var(--muted);font-weight:600;vertical-align:middle}
.tag.recupero{background:var(--warn-soft);color:var(--warn)}
.tag.suelta{background:#e6e8f6;color:#4b54a0}
.pill{font-size:12px;padding:4px 9px;border-radius:20px;background:var(--bg);color:var(--muted);white-space:nowrap;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.nomark{background:#fff;color:var(--warn);border:1.5px dashed var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}.chk input{width:auto;margin:0}
.li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);gap:8px;width:100%;text-align:left}
.li:first-of-type{border-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 8px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}
.aviso{background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:10px;font-size:13px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tot div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tot b{display:block;font-size:19px}.tot span{font-size:12px;color:var(--muted)}
.filt{display:flex;gap:6px;margin-bottom:12px}
.filt button{flex:1;padding:8px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:14px}
.filt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pago.okc{border-left:4px solid var(--ok)}
.pago:not(.okc){border-left:4px solid var(--bad)}
.phd b{font-size:17px}
.prow{display:flex;gap:8px;align-items:center;margin:8px 0}
.prow label{flex:1;margin:0}
.monto{width:120px;flex:none;text-align:right}
.sw{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;flex:1;margin:0}
.sw input{width:22px;height:22px;margin:0;accent-color:var(--ok)}
.dgrp{margin:8px 0}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.hchip{background:var(--accent-soft);color:var(--accent);border-radius:20px;padding:5px 6px 5px 11px;font-weight:600;display:flex;align-items:center;gap:4px}
.hchip small{font-weight:400;opacity:.8}
.hchip button{width:24px;height:24px;border-radius:50%;color:var(--bad);font-size:18px;line-height:1}
.addh{border-top:1px solid var(--line);margin-top:10px;padding-top:6px}
.diasel{display:flex;gap:5px;margin:8px 0}
.diasel label{flex:1;margin:0}
.diasel input{display:none}
.diasel span{display:block;text-align:center;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px}
.diasel input:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
.plan{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.plan:first-of-type{border-top:0;margin-top:0;padding-top:0}
.filebtn{cursor:pointer}
.radios label{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:15px;padding:6px 0}
.radios input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.opt{padding:14px 4px;border-radius:12px;font-weight:600;border:1.5px solid var(--line);background:#fff}
.opt.ok{color:var(--ok)}.opt.bad{color:var(--bad)}.opt.warn{color:var(--warn)}
.opt.ok.sel{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad.sel{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.warn.sel{background:var(--warn);color:#fff;border-color:var(--warn)}
.empty{text-align:center;padding:30px 14px}
.empty b{display:block;font-size:17px;margin-bottom:6px}
.legend{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabs button.on{color:var(--accent);font-weight:700}
#sheetWrap{position:fixed;inset:0;z-index:20}
#sheetWrap .backdrop{position:absolute;inset:0;background:rgba(30,28,25,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>
<nav id="tabs">
  <button data-t="cal" onclick="tab('cal')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
  <button data-t="al" onclick="tab('al')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.4 0 4 1.5 4.6 4.5"/></svg>Alumnos</button>
  <button data-t="pag" onclick="tab('pag')"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.8"/><path d="M6 9.5v.01M18 15.5v.01"/></svg>Pagos</button>
  <button data-t="aj" onclick="tab('aj')"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</nav>
<div id="sheetWrap" class="hidden"><div class="backdrop" onclick="closeSheet()"></div><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TIPO={fijo:'Fijo',suelta:'Suelta',recupero:'Recupero'};

function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function byNombre(a,b){return a.nombre.localeCompare(b.nombre,'es')}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function plata(n){return '$'+(Number(n)||0).toLocaleString('es-AR')}

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function wd(s){return ((parse(s).getDay()+6)%7)+1}           // 1=lunes … 7=domingo
function monday(s){return addDays(s,-(wd(s)-1))}
function TODAY(){return ymd(new Date())}
function ym(s){return s.slice(0,7)}
function fmtCorto(s){const d=parse(s);return d.getDate()+'/'+(d.getMonth()+1)}
function mesLabel(m){const[y,mm]=m.split('-').map(Number);return MESES[mm-1]+' '+y}
function addMonth(m,n){let[y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+String(mm).padStart(2,'0')}
function diasDesde(s){return Math.round((parse(TODAY())-parse(s))/864e5)}

const HOY_HASTA='10:00'; // en el cuaderno, hoy (21/10) está marcado hasta la clase de las 10
function semilla(){
  const st=defState(),porNombre={},hid=(d,h)=>'h'+d+String(h).padStart(2,'0');
  [1,2,3,4,5].forEach(d=>HORAS_SEM.forEach(h=>st.horarios.push({id:'h'+d+h,dia:d,hora:h+':00',cupo:4})));
  ['10','11'].forEach(h=>st.horarios.push({id:'h6'+h,dia:6,hora:h+':00',cupo:4}));
  const al=n=>{let a=porNombre[n];if(!a){a=porNombre[n]={id:uid(),nombre:n,tel:'',notas:'',activo:true,planes:[],contador:{desde:INICIO,base:0}};st.alumnos.push(a)}return a};
  GRILLA.forEach(([d,h,ns])=>ns.forEach(n=>{
    const c=CAMBIOS.find(x=>x[0]===n&&x[1]===d&&x[2]===h);
    st.fijos.push({id:uid(),alumnoId:al(n).id,horarioId:hid(d,h),desde:(c&&c[3])||INICIO,hasta:(c&&c[4])||null});
  }));
  SUSPENDIDOS.forEach(([f,m])=>st.suspendidos[f]={motivo:m});
  const k=(f,h,n)=>f+'|'+hid(wd(f),h)+'|'+al(n).id;
  AUS.forEach(([f,h,n])=>st.marcas[k(f,h,n)]={estado:'ausente'});
  REP.forEach(([f,h,n,nf,nh])=>{const e={id:uid(),fecha:nf,horarioId:hid(wd(nf),nh),alumnoId:al(n).id,tipo:'recupero',origen:k(f,h,n)};st.extras.push(e);st.marcas[k(f,h,n)]={estado:'reprogramada',a:{fecha:nf,horarioId:e.horarioId},extraId:e.id}});
  REC.forEach(([f,h,n])=>st.extras.push({id:uid(),fecha:f,horarioId:hid(wd(f),h),alumnoId:al(n).id,tipo:'recupero'}));
  // todo lo demás ya dado (hasta hoy a las 10) queda como presente
  const hoy=TODAY(),H2=id=>st.horarios.find(x=>x.id===id);
  for(let f=INICIO;f<=hoy;f=addDays(f,1)){
    if(st.suspendidos[f])continue;const lun=monday(f),w=wd(f);
    const pasa=h=>f<hoy||h.hora<=HOY_HASTA;
    st.fijos.forEach(x=>{const h=H2(x.horarioId);if(h.dia===w&&x.desde<=lun&&(!x.hasta||lun<x.hasta)&&pasa(h)){const kk=f+'|'+h.id+'|'+x.alumnoId;if(!st.marcas[kk])st.marcas[kk]={estado:'presente'}}});
    st.extras.forEach(e=>{const h=H2(e.horarioId);if(e.fecha===f&&pasa(h)){const kk=f+'|'+h.id+'|'+e.alumnoId;if(!st.marcas[kk])st.marcas[kk]={estado:'presente'}}});
  }
  NROS.forEach(([n,f,nro])=>{if(porNombre[n])porNombre[n].contador={desde:addDays(f,1),base:nro}});
  try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}
  return st;
}

const H=id=>S.horarios.find(h=>h.id===id);
const A=id=>S.alumnos.find(a=>a.id===id);
const P=id=>S.planes.find(p=>p.id===id);
function horariosDia(d){return S.horarios.filter(h=>h.dia===d).sort((a,b)=>a.hora.localeCompare(b.hora))}
function fijoActivo(f,lunes){return f.desde<=lunes&&(!f.hasta||lunes<f.hasta)}
function fijosActivos(hId,lunes){return S.fijos.filter(f=>f.horarioId===hId&&fijoActivo(f,lunes))}
function fijosDe(aId,lunes){return S.fijos.filter(f=>f.alumnoId===aId&&fijoActivo(f,lunes)&&H(f.horarioId)).sort((x,y)=>{const a=H(x.horarioId),b=H(y.horarioId);return (a.dia+a.hora).localeCompare(b.dia+b.hora)})}
function mkey(f,h,a){return f+'|'+h+'|'+a}

function enClase(fecha,hId){
  const lun=monday(fecha),out=[];
  fijosActivos(hId,lun).forEach(f=>{const a=A(f.alumnoId);if(a)out.push({alumno:a,tipo:'fijo',fijoId:f.id})});
  S.extras.filter(e=>e.fecha===fecha&&e.horarioId===hId).forEach(e=>{const a=A(e.alumnoId);if(a)out.push({alumno:a,tipo:e.tipo,extraId:e.id})});
  return out;
}
// Sin marca: clases pasadas quedan 'sinmarca' (ella marca el presente); futuras quedan pendientes.
function susp(fecha,hId){const sp=S.suspendidos||{};return sp[fecha]||sp[fecha+'|'+hId]||null}
function estadoDe(fecha,h,aId){if(susp(fecha,h))return 'suspendida';const m=S.marcas[mkey(fecha,h,aId)];if(m)return m.estado;return fecha<TODAY()?'sinmarca':'pend'}

function planDe(a,mes){let p='';(a.planes||[]).slice().sort((x,y)=>x.desde.localeCompare(y.desde)).forEach(x=>{if(x.desde<=mes)p=x.planId});return p}
function setPlanAlumno(a,mes,planId){a.planes=(a.planes||[]).filter(x=>x.desde!==mes);a.planes.push({desde:mes,planId})}
function planOpts(sel){return `<option value="">Sin plan / solo sueltas</option>`+S.planes.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nombre)}</option>`).join('')}
function sueltasMes(aId,mes){return S.extras.filter(e=>e.alumnoId===aId&&e.tipo==='suelta'&&ym(e.fecha)===mes).sort((a,b)=>a.fecha.localeCompare(b.fecha))}

function ocurrencias(aId,mes){
  const res=[];let d=mes+'-01';
  while(ym(d)===mes){const lun=monday(d);horariosDia(wd(d)).forEach(h=>{if(fijosActivos(h.id,lun).some(f=>f.alumnoId===aId))res.push({fecha:d,h,tipo:'fijo'})});d=addDays(d,1)}
  S.extras.filter(e=>e.alumnoId===aId&&ym(e.fecha)===mes).forEach(e=>{const h=H(e.horarioId);if(h)res.push({fecha:e.fecha,h,tipo:e.tipo})});
  res.forEach(o=>o.estado=estadoDe(o.fecha,o.h.id,aId));
  return res.sort((a,b)=>(a.fecha+a.h.hora).localeCompare(b.fecha+b.h.hora));
}
function resumen(occ){
  const r={tomadas:0,ausentes:0,reprog:0,proximas:0,sinmarca:0,susp:0,sueltas:0,recuperos:0,previstas:0};
  occ.forEach(o=>{
    if(o.tipo==='fijo')r.previstas++;
    if(o.tipo==='suelta')r.sueltas++;
    if(o.tipo==='recupero')r.recuperos++;
    if(o.estado==='presente')r.tomadas++;
    else if(o.estado==='sinmarca')r.sinmarca++;
    else if(o.estado==='ausente')r.ausentes++;
    else if(o.estado==='reprogramada')r.reprog++;
    else if(o.estado==='suspendida')r.susp++;
    else r.proximas++;
  });
  return r;
}
function pendientes(aId){
  return Object.keys(S.marcas).filter(k=>{
    if(!k.endsWith('|'+aId)||S.marcas[k].estado!=='ausente')return false;
    const[f,h]=k.split('|');
    if(!H(h))return false;
    return !S.extras.some(e=>e.fecha===f&&e.horarioId===h&&e.alumnoId===aId&&e.tipo==='suelta');
  }).sort();
}
/* Contador: número de clase de cada alumno, desde contador.desde (sin contar ausentes ni reprogramadas) */
let _memo={};
function primeraClase(a){let m=null;S.fijos.forEach(f=>{if(f.alumnoId===a.id&&(!m||f.desde<m))m=f.desde});S.extras.forEach(e=>{if(e.alumnoId===a.id&&(!m||e.fecha<m))m=e.fecha});return m}
function contDesde(a){return (a.contador&&a.contador.desde)||primeraClase(a)}
function clasesValidas(aId,desde,hasta){
  const k=aId+'|'+desde+'|'+hasta;if(_memo[k])return _memo[k];
  const misF=S.fijos.filter(f=>f.alumnoId===aId),res=[];
  for(let d=desde;d<=hasta;d=addDays(d,1)){const lun=monday(d),w=wd(d);misF.forEach(f=>{const h=H(f.horarioId);if(h&&h.dia===w&&fijoActivo(f,lun))res.push({fecha:d,h})})}
  S.extras.forEach(e=>{if(e.alumnoId===aId&&e.fecha>=desde&&e.fecha<=hasta){const h=H(e.horarioId);if(h)res.push({fecha:e.fecha,h})}});
  const ok=res.filter(o=>{const e=estadoDe(o.fecha,o.h.id,aId);return e!=='ausente'&&e!=='reprogramada'&&e!=='suspendida'}).sort((a,b)=>(a.fecha+a.h.hora).localeCompare(b.fecha+b.h.hora));
  return _memo[k]=ok;
}
function cicloDe(p){return p?(p.clases||p.porSemana*4):0}
/* Numeración consecutiva: no se reinicia por mes; vuelve a 1 al completar las clases del plan */
function numeracion(aId,hasta){
  const a=A(aId);if(!a)return [];const desde=contDesde(a);if(!desde||hasta<desde)return [];
  let c=(a.contador&&a.contador.base)||0;
  return clasesValidas(aId,desde,hasta).map(o=>{const tope=cicloDe(P(planDe(a,ym(o.fecha))));c++;if(tope&&c>tope)c=1;return {fecha:o.fecha,hId:o.h.id,n:c,tope}});
}
function nroClase(fecha,hId,aId){const x=numeracion(aId,fecha).find(o=>o.fecha===fecha&&o.hId===hId);return x||null}
function vaPor(a){const l=numeracion(a.id,TODAY()).filter(o=>o.fecha<TODAY()||estadoDe(o.fecha,o.hId,a.id)==='presente');const u=l[l.length-1];if(!u)return 'Todavía no tiene clases contadas.';return `Va por la clase <b>${u.n}</b>${u.tope?' de '+u.tope:''}.`}
function corregirNro(f,aId){const n=parseInt(document.getElementById('nroIn').value,10);if(!(n>=1))return toast('Poné un número válido');const a=A(aId);a.contador={desde:f,base:n-1};save();closeSheet();render();toast('Contador actualizado')}

function semana(n){ui.semana=addDays(ui.semana,7*n);render()}

function diasVisibles(){const d=[1,2,3,4,5,6];if(S.horarios.some(h=>h.dia===7))d.push(7);return d}

function pill(f,h,a,e){
  if(e==='presente')return `<span class="pill ok">Presente</span>`;
  if(e==='suspendida')return `<span class="pill">Suspendida</span>`;
  if(e==='sinmarca')return `<span class="pill nomark">Sin marcar</span>`;
  if(e==='ausente')return `<span class="pill bad">Ausente</span>`;
  if(e==='reprogramada'){const m=S.marcas[mkey(f,h,a)]||{};const t=m.a&&H(m.a.horarioId);return `<span class="pill warn">→ ${m.a?DIAS_C[wd(m.a.fecha)]+' '+fmtCorto(m.a.fecha)+(t?' '+t.hora:''):'Reprog.'}</span>`}
  return `<span class="pill">Marcar</span>`;
}

function vCal(){
  const lun=ui.semana,dias=diasVisibles();
  let h=`<div class="weeknav"><button class="ic" onclick="semana(-1)">‹</button><div class="wk"><b>Semana del ${fmtCorto(lun)}</b><span>al ${fmtCorto(addDays(lun,dias.length-1))}</span></div><button class="ic" onclick="semana(1)">›</button></div>`;
  if(lun!==monday(TODAY()))h+=`<button class="link center" onclick="irHoy()">Volver a esta semana</button>`;
  h+=`<div class="chips">`+dias.map(d=>{const f=addDays(lun,d-1);return `<button class="chip ${d===ui.dia?'on':''} ${f===TODAY()?'today':''} ${(S.suspendidos||{})[f]?'off':''}" onclick="ui.dia=${d};render()"><small>${DIAS_C[d]}</small><b>${parse(f).getDate()}</b></button>`}).join('')+`</div>`;
  if(!S.horarios.length)return h+empty('Todavía no cargaste horarios','Entrá a Ajustes y cargá los horarios de tus clases (por ejemplo, lunes 18:00). Después vas a poder sumar alumnos a cada uno.',`<button class="btn" onclick="tab('aj')">Cargar horarios</button>`);
  const fecha=addDays(lun,ui.dia-1),hs=horariosDia(ui.dia),fd=parse(fecha);
  h+=`<div class="dayttl">${DIAS[ui.dia]} ${fd.getDate()} de ${MESES[fd.getMonth()]}</div>`;

  if(hs.length)h+=sd?`<div class="susp"><b>Sin clases: ${esc(sd.motivo)}</b><span>No cuentan como ausencia ni suman al número de clase.</span><button class="link" onclick="habilitar('${fecha}')">Volver a habilitar el día</button></div>`:`<button class="link" onclick="hojaSuspender('${fecha}','el ${DIAS[wd(fecha)].toLowerCase()} ${fmtCorto(fecha)} completo')">Suspender el día (feriado / cancelación)</button>`;
  if(!hs.length)return h+`<p class="muted center">No hay clases este día.</p>`;
  hs.forEach(x=>{
    const l=enClase(fecha,x.id);
    const vienen=l.filter(i=>{const e=estadoDe(fecha,x.id,i.alumno.id);return e!=='reprogramada'&&e!=='ausente'}).length;

    h+=`<div class="card ${sd||sh?'cardoff':''}"><div class="slothd"><span class="hora">${x.hora}</span>${sd?'':sh?`<button class="link" onclick="habilitar('${fecha}|${x.id}')">Habilitar</button>`:`<span class="sl"><button class="link small" onclick="hojaSuspender('${fecha}|${x.id}','la clase de las ${x.hora}')">Suspender</button><span class="cupo ${vienen>x.cupo?'over':''}">${vienen}/${x.cupo}</span></span>`}</div>`;
    if(sh)h+=`<div class="muted small">Suspendida: ${esc(sh.motivo)}</div>`;
    if(!l.length)h+=`<div class="muted small">Sin alumnos</div>`;
    l.sort((a,b)=>byNombre(a.alumno,b.alumno)).forEach(i=>{
      const e=estadoDe(fecha,x.id,i.alumno.id);
      h+=`<button class="row" onclick="hojaClase('${fecha}','${x.id}','${i.alumno.id}')"><span class="nm">${(o=>o?`<b class="nro ${o.tope&&o.n===o.tope?'ult':''}">${o.n}</b>`:'')(nroClase(fecha,x.id,i.alumno.id))}${esc(i.alumno.nombre)}${i.tipo!=='fijo'?` <em class="tag ${i.tipo}">${TIPO[i.tipo]}</em>`:''}</span>${pill(fecha,x.id,i.alumno.id,e)}</button>`;
    });
    h+=`<button class="add" onclick="hojaAgregar('${fecha}','${x.id}')">+ Agregar alumno</button></div>`;
  });
  h+=`<p class="legend">Número en naranja = última clase del pack.</p>`;
  return h;
}

function hojaClase(f,hId,aId){
  const a=A(aId),h=H(hId);const it=enClase(f,hId).find(i=>i.alumno.id===aId);const e=estadoDe(f,hId,aId);
  if(e==='suspendida'){openSheet(`<h3>${esc(a.nombre)}</h3><p class="muted">${DIAS[wd(f)]} ${fmtCorto(f)} · ${h.hora}</p><p>Esta clase está suspendida (${esc(susp(f,hId).motivo)}). No cuenta como ausencia ni suma al número de clase.</p><button class="btn ghost" onclick="verFicha('${aId}')">Ver ficha</button>`);return}
  let x=`<h3>${esc(a.nombre)}</h3><p class="muted">${DIAS[wd(f)]} ${fmtCorto(f)} · ${h.hora}${it&&it.tipo!=='fijo'?' · '+TIPO[it.tipo]:''}</p>
  <div class="grid3"><button class="opt ok ${e==='presente'?'sel':''}" onclick="marcar('${f}','${hId}','${aId}','presente')">Presente</button><button class="opt bad ${e==='ausente'?'sel':''}" onclick="marcar('${f}','${hId}','${aId}','ausente')">Ausente</button>`;
  if(it&&it.tipo!=='suelta')x+=`<button class="opt warn ${e==='reprogramada'?'sel':''}" onclick="hojaReprog('${f}','${hId}','${aId}')">Reprogramar</button>`;
  x+=`</div>`;
  if(S.marcas[mkey(f,hId,aId)])x+=`<button class="link" onclick="marcar('${f}','${hId}','${aId}',null)">Borrar marca</button>`;
  x+=`<hr>`;
  if(it&&it.tipo==='fijo')x+=`<button class="btn ghost" onclick="quitarFijo('${it.fijoId}','${monday(f)}')">Sacar de este horario desde esta semana</button>`;
  if(it&&it.extraId)x+=`<button class="btn ghost" onclick="quitarExtra('${it.extraId}')">Quitar esta clase</button>`;
  const nroO=nroClase(f,hId,aId),nro=nroO?nroO.n:'';
  if(e!=='ausente'&&e!=='reprogramada')x+=`<div class="prow"><label>Número de clase<input id="nroIn" type="number" inputmode="numeric" min="1" value="${nro}"></label><button class="btn sm ghost" style="margin-top:22px" onclick="corregirNro('${f}','${aId}')">Corregir</button></div><p class="muted small">Para empezar un ciclo nuevo poné 1 en esta clase. Las siguientes se numeran solas.</p>`;
  x+=`<button class="btn ghost" onclick="verFicha('${aId}')">Ver ficha</button>`;
  openSheet(x);
}

function borrarExtra(id){
  const e=S.extras.find(x=>x.id===id);if(!e)return;
  S.extras=S.extras.filter(x=>x.id!==id);
  delete S.marcas[mkey(e.fecha,e.horarioId,e.alumnoId)];
  if(e.origen&&S.marcas[e.origen]&&S.marcas[e.origen].extraId===id)S.marcas[e.origen]={estado:'ausente'}; // vuelve a quedar para recuperar
}
function limpiarReprog(k){const m=S.marcas[k];if(m&&m.extraId){const id=m.extraId;delete S.marcas[k];borrarExtra(id)}}
function marcar(f,h,a,est){const k=mkey(f,h,a);limpiarReprog(k);if(est)S.marcas[k]={estado:est};else delete S.marcas[k];save();closeSheet();render()}
function quitarExtra(id){if(!confirm('¿Quitar esta clase?'))return;borrarExtra(id);save();closeSheet();render();toast('Clase quitada')}
function quitarFijo(id,lunes){
  if(!confirm('Deja de aparecer en este horario desde la semana del '+fmtCorto(lunes)+'. Las semanas anteriores no cambian. ¿Seguimos?'))return;
  const f=S.fijos.find(x=>x.id===id);if(!f)return;
  if(f.desde>=lunes)S.fijos=S.fijos.filter(x=>x.id!==id);else f.hasta=lunes;
  save();closeSheet();render();toast('Listo');
}

function hojaSuspender(clave,que){
  openSheet(`<h3>Suspender ${que}</h3><div class="radios"><label><input type="radio" name="spM" value="Feriado" checked> Feriado</label><label><input type="radio" name="spM" value="Cancelada por la profe"> Cancelada por la profe</label><label><input type="radio" name="spM" value="otro"> Otro motivo</label></div><label>Detalle (opcional)<input id="spO" placeholder="Ej.: corte de luz"></label><p class="muted small">Las clases suspendidas no cuentan como ausencia ni suman al número de clase.</p><button class="btn" onclick="confSuspender('${clave}')">Suspender</button>`);
}
function confSuspender(clave){let m=document.querySelector('input[name=spM]:checked').value;const o=document.getElementById('spO').value.trim();if(m==='otro')m=o||'Otro motivo';else if(o)m+=' ('+o+')';S.suspendidos=S.suspendidos||{};S.suspendidos[clave]={motivo:m};save();closeSheet();render();toast('Suspendida')}
function habilitar(clave){if(!confirm('¿Volver a habilitar?'))return;delete S.suspendidos[clave];save();render()}
function hojaReprog(f,hId,aId){
  const a=A(aId),h=H(hId);

function rpOpts(){

}
function confReprog(f,hId,aId){
  const nf=document.getElementById('rpF').value,nh=document.getElementById('rpH').value;

}

function agOpts(){

function nuevoAlumno(n,planId,tel){const a={id:uid(),nombre:n,tel:tel||'',notas:'',activo:true,planes:[]};if(planId)a.planes.push({desde:ym(TODAY()),planId});S.alumnos.push(a);return a}
function confAgregar(f,hId){
  let aId=document.getElementById('agA').value;const t=document.querySelector('input[name=agT]:checked').value;
  if(!aId)return toast('Elegí un alumno');
  if(aId==='__nuevo'){const n=document.getElementById('agN').value.trim();if(!n)return toast('Escribí el nombre');aId=nuevoAlumno(n,document.getElementById('agP').value).id}
  if(enClase(f,hId).some(i=>i.alumno.id===aId))return toast('Ya está en esta clase');
  if(t==='fijo')S.fijos.push({id:uid(),alumnoId:aId,horarioId:hId,desde:monday(f),hasta:null});
  else{
    const e={id:uid(),fecha:f,horarioId:hId,alumnoId:aId,tipo:t};
    if(t==='suelta'){e.monto=S.precioSuelta;e.pagado=false}
    const o=document.getElementById('agO');
    if(t==='recupero'&&o&&o.value){e.origen=o.value;S.marcas[o.value]={estado:'reprogramada',a:{fecha:f,horarioId:hId},extraId:e.id}}
    S.extras.push(e);
  }
  save();closeSheet();render();toast('Agregado');
}

/* ============ Alumnos ============ */
function estadoPago(a,mes){
  const p=planDe(a,mes),sl=sueltasMes(a.id,mes);
  if(!p&&!sl.length)return '';
  const pg=S.pagos[mes+'|'+a.id];
  const debe=(p&&!(pg&&pg.pagado))||sl.some(e=>!e.pagado);
  return debe?`<span class="pill bad">Debe</span>`:`<span class="pill ok">Pagó</span>`;
}
function vAlumnos(){
  return `<div class="toolbar"><input type="search" placeholder="Buscar alumno" value="${esc(ui.busq)}" oninput="ui.busq=this.value;document.getElementById('alist').innerHTML=listaAl()"><button class="btn sm" onclick="hojaNuevo()">+ Nuevo</button></div>
  <div id="alist">${listaAl()}</div>
  <label class="chk"><input type="checkbox" ${ui.verBajas?'checked':''} onchange="ui.verBajas=this.checked;render()"> Mostrar alumnos dados de baja</label>`;
}
function listaAl(){
  if(!S.alumnos.length)return empty('Sin alumnos todavía','Podés cargarlos acá o directamente desde el Calendario cuando agregás a alguien a un horario.','');
  const q=norm(ui.busq),mes=ym(TODAY()),lun=monday(TODAY());
  const l=S.alumnos.filter(a=>(ui.verBajas||a.activo!==false)&&norm(a.nombre).includes(q)).sort(byNombre);
  if(!l.length)return `<p class="muted center">Sin resultados</p>`;
  return l.map(a=>{
    const p=P(planDe(a,mes)),fx=fijosDe(a.id,lun),pen=pendientes(a.id).length;
    return `<button class="card arow" onclick="verFicha('${a.id}')"><div><b>${esc(a.nombre)}</b>${a.activo===false?' <em class="tag">Baja</em>':''}<div class="muted small">${p?esc(p.nombre):'Sin plan'}${fx.length?' · '+fx.map(f=>{const x=H(f.horarioId);return DIAS_C[x.dia]+' '+x.hora}).join(', '):''}</div></div><div class="badges">${estadoPago(a,mes)}${pen?`<span class="pill warn">${pen} a recuperar</span>`:''}</div></button>`;
  }).join('');
}
function hojaNuevo(){
  openSheet(`<h3>Nuevo alumno</h3><label>Nombre<input id="nN" placeholder="Nombre y apellido"></label><label>Teléfono (opcional)<input id="nT" type="tel"></label><label>Plan<select id="nP">${planOpts('')}</select></label><button class="btn" onclick="confNuevo()">Guardar</button><p class="muted small">Después asignale sus horarios desde el Calendario.</p>`);
}
function confNuevo(){const n=document.getElementById('nN').value.trim();if(!n)return toast('Escribí el nombre');const a=nuevoAlumno(n,document.getElementById('nP').value,document.getElementById('nT').value.trim());save();verFicha(a.id)}
function verFicha(id){ui.tab='al';ui.alumnoId=id;ui.mesAl=ym(TODAY());closeSheet();render();window.scrollTo(0,0)}

function vFicha(){
  const a=A(ui.alumnoId);if(!a){ui.alumnoId=null;return vAlumnos()}
  const mes=ui.mesAl,occ=ocurrencias(a.id,mes),r=resumen(occ),pid=planDe(a,mes),p=P(pid),lun=monday(TODAY()),fx=fijosDe(a.id,lun),pen=pendientes(a.id);
  let h=`<button class="link" onclick="ui.alumnoId=null;render()">‹ Alumnos</button>
  <div class="card"><label>Nombre<input id="fN" value="${esc(a.nombre)}"></label><label>Teléfono<input id="fT" type="tel" value="${esc(a.tel||'')}"></label><label>Notas<textarea id="fO" rows="2">${esc(a.notas||'')}</textarea></label>
  <div class="rowbtns"><button class="btn sm" onclick="guardarFicha()">Guardar</button>${a.tel?`<a class="btn sm ghost" href="https://wa.me/${esc(a.tel.replace(/\D/g,''))}" target="_blank" rel="noopener">WhatsApp</a>`:''}</div></div>`;
  h+=`<div class="card"><h4>Contador de clases</h4><p>${vaPor(a)}</p><div class="prow"><label>Contar desde<input type="date" id="cD" value="${contDesde(a)||TODAY()}"></label><label>Clases ya hechas del ciclo<input type="number" id="cB" inputmode="numeric" min="0" value="${(a.contador&&a.contador.base)||0}"></label></div><button class="btn sm ghost" onclick="guardarContador('${a.id}')">Guardar contador</button><p class="muted small">La cuenta sigue de corrido entre meses y vuelve a 1 al completar las clases del plan. Las ausentes o reprogramadas no suman.</p></div>`;
  h+=`<div class="card"><h4>Horarios fijos</h4>${fx.length?fx.map(f=>{const x=H(f.horarioId);return `<div class="li"><span>${DIAS[x.dia]} ${x.hora}</span><button class="link bad" onclick="quitarFijo('${f.id}','${lun}')">Sacar</button></div>`}).join(''):'<p class="muted small">No tiene horarios fijos. Se agregan desde el Calendario.</p>'}
  ${p&&a.activo!==false&&fx.length!==p.porSemana?`<p class="aviso">Su plan es de ${p.porSemana} por semana y tiene ${fx.length} horario${fx.length===1?'':'s'} fijo${fx.length===1?'':'s'}.</p>`:''}</div>`;
  h+=`<div class="mesnav"><button class="ic" onclick="ui.mesAl=addMonth(ui.mesAl,-1);render()">‹</button><b>${cap(mesLabel(mes))}</b><button class="ic" onclick="ui.mesAl=addMonth(ui.mesAl,1);render()">›</button></div>`;
  const pg=S.pagos[mes+'|'+a.id];
  h+=`<div class="card"><label>Plan de este mes<select onchange="cambiarPlan('${a.id}','${mes}',this.value)">${planOpts(pid)}</select></label><p class="muted small">Si lo cambiás, rige desde ${mesLabel(mes)} en adelante.</p>
  <div class="stats">${stat(r.tomadas,'Tomadas')}${stat(r.ausentes,'Ausentes')}${stat(r.reprog,'Reprogramadas')}${stat(r.recuperos,'Recuperos')}${stat(r.sueltas,'Sueltas')}${stat(r.sinmarca,'Sin marcar')}</div>
  <p class="muted small">Clases fijas del mes: ${r.previstas}${r.proximas?' · Por venir: '+r.proximas:''}${r.susp?' · Suspendidas: '+r.susp:''}${p?' · Plan: '+p.porSemana+' por semana':''}</p>
  ${pid||sueltasMes(a.id,mes).length?`<div class="li"><span>Pago de ${MESES[+mes.slice(5)-1]}: ${estadoPago(a,mes)}${pg&&pg.pagado&&pg.fecha?' <span class="muted small">el '+fmtCorto(pg.fecha)+'</span>':''}</span><button class="link" onclick="ui.mesPagos='${mes}';tab('pag')">Ir a pagos</button></div>`:''}</div>`;
  h+=`<div class="card"><h4>Clases de ${mesLabel(mes)}</h4>${occ.length?occ.map(o=>`<button class="li" onclick="hojaClase('${o.fecha}','${o.h.id}','${a.id}')"><span>${DIAS_C[wd(o.fecha)]} ${fmtCorto(o.fecha)} · ${o.h.hora}${o.tipo!=='fijo'?` <em class="tag ${o.tipo}">${TIPO[o.tipo]}</em>`:''}</span>${pill(o.fecha,o.h.id,a.id,o.estado)}</button>`).join(''):'<p class="muted small">Sin clases este mes.</p>'}</div>`;
  if(pen.length)h+=`<div class="card"><h4>Pendientes de recuperar</h4>${pen.map(k=>{const[f,hh]=k.split('|');return `<div class="li"><span>${descKey(k)}</span><button class="link" onclick="hojaReprog('${f}','${hh}','${a.id}')">Reprogramar</button></div>`}).join('')}</div>`;
  h+=`<div class="rowbtns">${a.activo===false?`<button class="btn ghost" onclick="reactivar('${a.id}')">Reactivar</button>`:`<button class="btn ghost" onclick="darBaja('${a.id}')">Dar de baja</button>`}<button class="btn ghost bad" onclick="eliminarAl('${a.id}')">Eliminar</button></div>`;
  return h;
}
function guardarFicha(){const a=A(ui.alumnoId);const n=document.getElementById('fN').value.trim();if(!n)return toast('El nombre no puede quedar vacío');a.nombre=n;a.tel=document.getElementById('fT').value.trim();a.notas=document.getElementById('fO').value;save();render();toast('Guardado')}
function cambiarPlan(aId,mes,pid){setPlanAlumno(A(aId),mes,pid);save();render();toast('Plan actualizado desde '+mesLabel(mes))}
function darBaja(id){
  if(!confirm('Se la saca de sus horarios fijos desde esta semana. Su historial se conserva. ¿Dar de baja?'))return;
  const a=A(id),lun=monday(TODAY());a.activo=false;
  S.fijos=S.fijos.filter(f=>!(f.alumnoId===id&&f.desde>=lun));
  S.fijos.forEach(f=>{if(f.alumnoId===id&&(!f.hasta||f.hasta>lun))f.hasta=lun});
  save();render();toast('Dada de baja');
}
function reactivar(id){A(id).activo=true;save();render();toast('Reactivada: asignale sus horarios desde el Calendario')}
function eliminarAl(id){
  if(!confirm('Se borra el alumno con TODO su historial de clases y pagos. ¿Eliminar?'))return;
  S.alumnos=S.alumnos.filter(a=>a.id!==id);S.fijos=S.fijos.filter(f=>f.alumnoId!==id);S.extras=S.extras.filter(e=>e.alumnoId!==id);
  Object.keys(S.marcas).forEach(k=>{if(k.endsWith('|'+id))delete S.marcas[k]});
  Object.keys(S.pagos).forEach(k=>{if(k.endsWith('|'+id))delete S.pagos[k]});
  ui.alumnoId=null;save();render();toast('Eliminado');
}

/* ============ Pagos ============ */
function montoPlan(a,mes){const pg=S.pagos[mes+'|'+a.id];if(pg&&pg.monto!=null)return pg.monto;const p=P(planDe(a,mes));return p?p.precio:0}
function setPago(k,campo,v){
  const[mes,aId]=k.split('|');const pg=S.pagos[k]=S.pagos[k]||{};
  if(campo==='pagado'){pg.pagado=v;pg.fecha=v?TODAY():null;if(v&&pg.monto==null)pg.monto=montoPlan(A(aId),mes)}
  else pg[campo]=v;
  save();render();
}
function setSuelta(id,campo,v){const e=S.extras.find(x=>x.id===id);if(!e)return;e[campo]=v;save();render()}
function vPagos(){
  const mes=ui.mesPagos;let cob=0,pend=0;
  const rows=S.alumnos.filter(a=>a.activo!==false||S.pagos[mes+'|'+a.id]||sueltasMes(a.id,mes).length).sort(byNombre).map(a=>{
    const pid=planDe(a,mes),p=P(pid),k=mes+'|'+a.id,pg=S.pagos[k]||{},monto=montoPlan(a,mes),sl=sueltasMes(a.id,mes);
    if(p){if(pg.pagado)cob+=+monto||0;else pend+=+monto||0}
    sl.forEach(e=>{if(e.pagado)cob+=+e.monto||0;else pend+=+e.monto||0});
    const tiene=!!p||sl.length>0;
    const debe=(p&&!pg.pagado)||sl.some(e=>!e.pagado);
    const html=`<div class="card pago ${debe||!tiene?'':'okc'}" ${!tiene?'style="border-left-color:var(--line)"':''}>
      <div class="phd"><b onclick="verFicha('${a.id}')">${esc(a.nombre)}</b></div>
      <label>Plan<select onchange="cambiarPlan('${a.id}','${mes}',this.value)">${planOpts(pid)}</select></label>
      ${p?`<div class="prow"><label class="sw"><input type="checkbox" ${pg.pagado?'checked':''} onchange="setPago('${k}','pagado',this.checked)"><span>${pg.pagado?'Pagó'+(pg.fecha?' el '+fmtCorto(pg.fecha):''):'No pagó'}</span></label><input class="monto" type="number" inputmode="numeric" value="${monto}" onchange="setPago('${k}','monto',+this.value)"></div>
      <select onchange="setPago('${k}','metodo',this.value)">${['','Efectivo','Transferencia','Otro'].map(m=>`<option value="${m}" ${(pg.metodo||'')===m?'selected':''}>${m||'Medio de pago…'}</option>`).join('')}</select>`:''}
      ${sl.map(e=>`<div class="prow"><label class="sw"><input type="checkbox" ${e.pagado?'checked':''} onchange="setSuelta('${e.id}','pagado',this.checked)"><span>Clase suelta ${fmtCorto(e.fecha)}</span></label><input class="monto" type="number" inputmode="numeric" value="${e.monto||0}" onchange="setSuelta('${e.id}','monto',+this.value)"></div>`).join('')}
    </div>`;
    return{debe,tiene,html};
  });
  let h=`<div class="mesnav"><button class="ic" onclick="ui.mesPagos=addMonth(ui.mesPagos,-1);render()">‹</button><b>${cap(mesLabel(mes))}</b><button class="ic" onclick="ui.mesPagos=addMonth(ui.mesPagos,1);render()">›</button></div>
  <div class="tot"><div><b style="color:var(--ok)">${plata(cob)}</b><span>Cobrado</span></div><div><b style="color:var(--bad)">${plata(pend)}</b><span>Falta cobrar</span></div></div>
  <div class="filt">${[['todos','Todos'],['deben','Deben'],['pagaron','Pagaron']].map(([v,l])=>`<button class="${ui.filtroPago===v?'on':''}" onclick="ui.filtroPago='${v}';render()">${l}</button>`).join('')}</div>`;
  const f=rows.filter(r=>ui.filtroPago==='todos'||(ui.filtroPago==='deben'?r.debe:(r.tiene&&!r.debe)));
  if(!S.alumnos.length)return h+empty('Sin alumnos todavía','Cuando cargues alumnos van a aparecer acá para registrar sus pagos.','');
  h+=f.length?f.map(r=>r.html).join(''):`<p class="muted center">Nadie en esta lista.</p>`;
  h+=`<p class="legend">Las clases sueltas se agregan desde el Calendario y aparecen acá para cobrarlas.</p>`;
  return h;
}

/* ============ Ajustes ============ */

  <div class="prow"><label>Hora<input type="time" id="hH" value="18:00"></label><label>Cupo<input type="number" id="hC" value="4" min="1" inputmode="numeric"></label></div>

  <button class="btn ghost" onclick="nuevoPlan()">+ Agregar plan</button>
  <label>Precio de la clase suelta $<input type="number" inputmode="numeric" value="${S.precioSuelta}" onchange="S.precioSuelta=+this.value;save();toast('Guardado')"></label></div>`;
  const ub=S.ultimoBackup,viejo=!ub||diasDesde(ub)>14;
  h+=`<div class="card"><h4>Copia de seguridad</h4><p class="small">Los datos se guardan en este celular. Hacé una copia cada tanto y guardala en Drive, mail o WhatsApp.</p>
  <p class="small ${viejo?'aviso':'muted'}">${ub?'Última copia: '+fmtCorto(ub)+'/'+ub.slice(0,4):'Todavía no hiciste ninguna copia.'}</p>
  <button class="btn" onclick="exportar()">Hacer copia de seguridad</button>
  <label class="btn ghost filebtn">Recuperar desde una copia<input type="file" accept=".json,application/json" onchange="importar(this)" hidden></label></div>
  <button class="link bad center" onclick="borrarTodo()">Borrar todos los datos</button>`;
  return h;
}
function agregarHorario(){
  const dias=[...document.querySelectorAll('.hd:checked')].map(i=>+i.value),hora=document.getElementById('hH').value,cupo=Math.max(1,+document.getElementById('hC').value||1);
  if(!dias.length)return toast('Marcá al menos un día');if(!hora)return toast('Elegí la hora');
  let n=0;dias.forEach(d=>{if(!S.horarios.some(h=>h.dia===d&&h.hora===hora)){S.horarios.push({id:uid(),dia:d,hora,cupo});n++}});
  save();render();toast(n?'Horario agregado':'Ese horario ya existía');
}
function borrarHorario(id){
  const n=S.fijos.filter(f=>f.horarioId===id).length+S.extras.filter(e=>e.horarioId===id).length;
  if(!confirm(n?'Este horario tiene alumnos e historial cargados. Si lo borrás se pierde todo lo de ese horario. ¿Borrar?':'¿Borrar este horario?'))return;
  S.horarios=S.horarios.filter(h=>h.id!==id);S.fijos=S.fijos.filter(f=>f.horarioId!==id);S.extras=S.extras.filter(e=>e.horarioId!==id);
  Object.keys(S.marcas).forEach(k=>{if(k.split('|')[1]===id)delete S.marcas[k]});
  save();render();
}
function setPlanCfg(id,campo,v){const p=P(id);if(!p)return;p[campo]=v;save();toast('Guardado')}
function nuevoPlan(){S.planes.push({id:uid(),nombre:'Nuevo plan',porSemana:1,precio:0});save();render()}
function borrarPlan(id){if(S.alumnos.some(a=>(a.planes||[]).some(x=>x.planId===id)))return toast('Hay alumnos con este plan: cambiales el plan primero');if(!confirm('¿Borrar este plan?'))return;S.planes=S.planes.filter(p=>p.id!==id);save();render()}

async function exportar(){
  const name='agenda-pilates-'+TODAY()+'.json';
  const copia=Object.assign({},S,{ultimoBackup:TODAY()});
  const file=new File([JSON.stringify(copia)],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia Agenda Pilates'});S.ultimoBackup=TODAY();save();render();toast('Copia guardada');return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(file),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
  S.ultimoBackup=TODAY();save();render();toast('Copia descargada');
}
function importar(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.alumnos)||!Array.isArray(d.horarios))throw 0;
      if(!confirm('Esto reemplaza todos los datos actuales por los de la copia. ¿Seguimos?'))return;
      S=Object.assign(defState(),d);save();render();toast('Datos recuperados');
    }catch(e){toast('Ese archivo no es una copia válida')}
    inp.value='';
  };
  r.readAsText(f);
}
function borrarTodo(){if(!confirm('Se borran TODOS los datos de este celular. ¿Seguro?'))return;if(!confirm('Última confirmación: ¿borrar todo?'))return;S=defState();save();render();toast('Datos borrados')}

/* ============ Inicio ============ */
load();
(function(){
  const hoy=TODAY(),w=wd(hoy);
  ui.mesPagos=ym(hoy);ui.mesAl=ym(hoy);
  if(w===7&&!S.horarios.some(h=>h.dia===7)){ui.semana=monday(addDays(hoy,1));ui.dia=1}
  else{ui.semana=monday(hoy);ui.dia=w}
})();
render();
</script>
